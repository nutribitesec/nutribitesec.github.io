<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nutribites · Panel del dueño</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/kooky.css">
<style>
  body{padding:12px;overflow:hidden}
  #root{height:100%}
  svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  #app{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 24px);border:3px solid var(--ink);border-radius:30px;background:var(--cream);overflow:hidden;box-shadow:6px 6px 0 var(--ink)}

  /* Barra lateral */
  nav{padding:16px 14px;display:flex;flex-direction:column;gap:6px;background:var(--paper);border-right:3px solid var(--ink);overflow:auto;position:relative}
  .logo-wrap{padding:2px 6px 10px;text-align:center}
  .logo-wrap .logo-img{width:100%;max-width:210px;margin:0 auto}
  .logo-wrap small{display:block;font-weight:800;font-size:10px;letter-spacing:2px;color:var(--ink);margin-top:2px}
  .usr{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
  .usr .avatar{width:44px;height:44px;border-radius:50%}
  .usr b{display:block;line-height:1.2}.usr small{color:var(--mu);font-weight:600}
  .usr>div{flex:1;min-width:0}
  .bell{position:relative;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
  .bell i{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--yel);color:var(--ink);border:2px solid var(--ink);font:800 11px/16px 'DM Sans';text-align:center;font-style:normal;padding:0 4px}
  .bell i:empty{display:none}
  .srch{position:relative;display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:0 14px;height:48px;color:var(--mu)}
  .srch input{flex:1;background:none;border:0;outline:0;min-width:0;color:var(--ink);font-weight:600}
  .qr{position:absolute;left:0;right:0;top:54px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;z-index:1200;overflow:hidden;display:none;box-shadow:4px 4px 0 var(--ink)}
  .qr button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;color:var(--ink)}
  .qr button:hover{background:var(--yel2)}.qr small{color:var(--mu)}
  .inbox{padding:12px 4px 8px;cursor:pointer}
  .inbox h2{font-size:22px;display:flex;align-items:center;gap:10px}
  .inbox .chip{font-size:13px;padding:3px 10px}
  .inbox small{color:var(--mu);font-weight:600}
  nav a.t{display:flex;align-items:center;gap:13px;padding:0 14px;height:46px;border-radius:99px;color:var(--ink);font-weight:800;cursor:pointer;border:2.5px solid transparent}
  nav a.t:hover{background:var(--yel2)}
  nav a.t.on{background:var(--yel);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  nav a.t .nb{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;border:2px solid var(--ink);font:800 12px/18px 'DM Sans';text-align:center;font-style:normal;padding:0 6px}
  nav a.t .nb:empty{display:none}
  nav .sp{flex:1;min-height:20px}

  /* Contenido */
  main{overflow:auto;padding:26px 30px 40px;min-width:0}
  main.fill{padding:12px;overflow:hidden}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  header.top h1{font-size:30px;line-height:1.05}
  header.top p{color:var(--mu);font-weight:600;margin-top:4px}
  .tools{display:flex;gap:10px;align-items:center}
  .pad{padding:18px 20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
  .mapbox{height:520px;border-radius:var(--r);overflow:hidden;border:2.5px solid var(--ink);box-shadow:var(--sh)}
  .seller{display:flex;align-items:center;gap:12px}
  .rutas{display:grid;grid-template-columns:340px 1fr;gap:14px;height:calc(100vh - 190px);min-height:520px}
  .rutas .side{display:flex;flex-direction:column;overflow:hidden}
  .rutas .side .lst{overflow:auto;flex:1}
  .rutas .mapbox{height:100%}
  .li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1.5px dashed rgba(22,19,18,.25)}
  .li .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--ink);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
  .li small{color:var(--mu);display:block}
  .li .x{margin-left:auto;background:none;border:0;color:var(--mu);font-size:18px}
  .li .x:hover{color:var(--red)}

  /* Tablero */
  .dash{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:14px;height:100%}
  .mapp{position:relative;border-radius:26px;overflow:hidden;border:3px solid var(--ink);background:#e9e2d0;box-shadow:var(--sh)}
  .mapp #map{position:absolute;inset:0}
  .ov{position:absolute;z-index:900}
  .tl{left:14px;top:14px;display:flex;flex-direction:column;gap:10px;max-width:calc(100% - 200px)}
  .tl .tt{background:var(--paper);border-radius:18px;padding:12px 18px;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .tl h1{font-size:26px;line-height:1.05}
  .tl p{color:var(--mu);font-size:13px;font-weight:600}
  .lg{display:flex;flex-direction:column;gap:6px;background:var(--paper);border-radius:14px;padding:10px 14px;font-size:12px;font-weight:700;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);align-self:flex-start}
  .lg span{display:flex;align-items:center;gap:8px}
  .lg .dot{border:1.5px solid var(--ink)}
  .tr{right:14px;top:14px;display:flex;gap:8px;align-items:flex-start}
  .tr input[type=date]{height:46px;border-radius:23px;padding:0 16px;width:auto;box-shadow:0 3px 0 var(--ink)}
  .rb{width:46px;height:46px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
  .rb:hover{background:var(--yel2)}
  .menu{position:absolute;right:0;top:54px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:8px;min-width:210px;box-shadow:4px 4px 0 var(--ink)}
  .menu label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:600}
  .menu label:hover{background:var(--yel2)}
  .br{right:14px;bottom:26px;display:flex;flex-direction:column;gap:8px}
  .gl{width:42px;height:42px;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink);box-shadow:2px 3px 0 var(--ink);animation:ring 2s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(22,19,18,.35),2px 3px 0 var(--ink)}100%{box-shadow:0 0 0 16px transparent,2px 3px 0 var(--ink)}}
  .leaflet-control-attribution{position:absolute;left:0;bottom:0}

  /* Tarjeta flotante del vendedor */
  .sc{left:14px;bottom:30px;width:300px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:14px;z-index:950;box-shadow:5px 5px 0 var(--ink)}
  .sc .h{display:flex;gap:12px;align-items:center}
  .sc .h b{display:block}.sc .h small{color:var(--mu);font-weight:600}
  .sc .x{margin-left:auto;background:none;border:0;color:var(--ink);font-size:18px;align-self:flex-start;font-weight:800}
  .sc .in2{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sc .in2 small{color:var(--mu);display:block;font-size:11px;font-weight:700;text-transform:uppercase}.sc .in2 b{font-size:17px}
  .sc .nx{margin-top:10px;font-size:12px;color:var(--mu);font-weight:600}

  /* Columna derecha */
  .rc{overflow:auto;display:flex;flex-direction:column;gap:14px;padding:2px 6px 8px 2px}
  .kp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .k{border-radius:24px;padding:16px;color:var(--ink);position:relative;border:2.5px solid var(--ink);box-shadow:var(--sh)}
  .k .ic{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--cream);display:grid;place-items:center}
  .k .row{display:flex;align-items:center;gap:10px}
  .k .row b{font-size:14px;line-height:1.15;font-weight:800}
  .k .v{font-family:var(--disp);font-size:34px;margin-top:10px;line-height:1;letter-spacing:0}
  .k .v small{font-family:var(--body);font-size:16px;font-weight:800;opacity:.6}
  .k .s{font-size:12px;font-weight:600;opacity:.8;margin-top:6px;display:flex;align-items:center;gap:5px}
  .k a{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:2px solid var(--ink);color:var(--ink);font-weight:800;font-size:13px;cursor:pointer}
  .k.c1{background:var(--sky)}.k.c2{background:var(--yel)}.k.c3{background:#BFE59B}.k.c4{background:var(--pch)}
  .vcard{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:14px;box-shadow:var(--sh)}
  .vcard>h2{font-size:20px;margin:2px 4px 12px;display:flex;justify-content:space-between;align-items:center}
  .vc{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:12px;margin-bottom:12px}
  .vc:last-child{margin-bottom:0}
  .vh{display:flex;align-items:center;gap:12px}
  .vh .avatar{width:44px;height:44px}
  .vh b{display:block;line-height:1.2;font-size:16px}
  .vh span.z{color:var(--mu);font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
  .vh svg.i{width:13px;height:13px}
  .vh>div{flex:1;min-width:0}
  .vh button{background:none;border:0;color:var(--ink);transition:.2s}
  .vc.col .vh button{transform:rotate(180deg)}
  .vc.col .vb,.vc.col .vf{display:none}
  .vb{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:12px}
  .vbox{background:var(--cream);border:2px solid var(--ink);border-radius:16px;padding:12px}
  .vbox .l{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;font-size:12px;margin-bottom:8px}
  .vbox .l svg.i{width:14px;height:14px}
  .seg{display:flex;gap:2px;height:34px;align-items:flex-end;margin-bottom:8px}
  .seg i{flex:1;border-radius:2px;background:#E0D2AE;height:100%}
  .seg i.d{background:var(--grn)}.seg i.s{background:var(--red)}
  .seg i.n{background:var(--yel);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.35}}
  .vbox .big{display:flex;align-items:baseline;gap:5px}
  .vbox .big b{font-family:var(--disp);font-size:26px;font-weight:400;line-height:1}
  .vbox .big small{color:var(--mu);font-size:12px;font-weight:600}
  .vf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .vf .btn{height:44px}
  .evc{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:16px;box-shadow:var(--sh)}
  .ev{display:flex;gap:12px;padding:11px 0;border-bottom:1.5px dashed rgba(22,19,18,.25)}
  .ev:last-child{border:0}
  .empty{padding:30px 16px}
  @media(max-width:1100px){
    body{padding:0;overflow:auto}
    #app{display:block;height:auto;border-radius:0;border-width:0 0 3px;box-shadow:none}
    nav{flex-direction:row;align-items:center;overflow:auto;border-right:0;border-bottom:3px solid var(--ink);padding:10px}
    nav .logo-wrap,nav .usr,nav .srch,nav .inbox,nav .sp{display:none}
    main.fill{overflow:visible}.dash{display:block;height:auto}
    .mapp{height:520px;margin-bottom:14px}.rc{overflow:visible}
    .kpis{grid-template-columns:1fr 1fr}.grid2,.rutas{grid-template-columns:1fr;height:auto}main{padding:16px}.mapbox{height:380px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="../assets/vendor/leaflet/leaflet.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/common.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/login.js"></script>
<script src="admin.js"></script>
</body>
</html>
